name: Four cloud nodes - Snake load validation
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope (800 players for 60/180 seconds, or 20-player preflight)
        type: choice
        options: [smoke, '60', '180']
        required: true
permissions:
  contents: read
concurrency:
  group: snake-load-acceptance
  cancel-in-progress: false
jobs:
  load:
    name: Cloud node ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official k6 with verified checksum
        run: |
          curl --fail --location --retry 3 https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-arm64.tar.gz -o k6.tar.gz
          echo '5ca3433e8201da72a284aaa241a1bb5fb47f4abb4e384d39410ddd8062f49b90  k6.tar.gz' | sha256sum --check --strict
          tar -xzf k6.tar.gz --strip-components=1 k6-v2.3.0-linux-arm64/k6
      - name: Build pinned k6 with transport-error diagnostics
        run: python3 scripts/build-diagnostic-k6.py
      - name: Run cloud shard
        env:
          BUNDLE_KEY: ${{ secrets.TEST_BUNDLE_KEY }}
          BUNDLE_PART_COUNT: ${{ secrets[format('LOAD{0}_PART_COUNT', inputs.scope)] }}
          BUNDLE_00: ${{ secrets[format('LOAD{0}_00', inputs.scope)] }}
          BUNDLE_01: ${{ secrets[format('LOAD{0}_01', inputs.scope)] }}
          BUNDLE_02: ${{ secrets[format('LOAD{0}_02', inputs.scope)] }}
          BUNDLE_03: ${{ secrets[format('LOAD{0}_03', inputs.scope)] }}
          BUNDLE_04: ${{ secrets[format('LOAD{0}_04', inputs.scope)] }}
          BUNDLE_05: ${{ secrets[format('LOAD{0}_05', inputs.scope)] }}
          BUNDLE_06: ${{ secrets[format('LOAD{0}_06', inputs.scope)] }}
          BUNDLE_07: ${{ secrets[format('LOAD{0}_07', inputs.scope)] }}
          BUNDLE_08: ${{ secrets[format('LOAD{0}_08', inputs.scope)] }}
          BUNDLE_09: ${{ secrets[format('LOAD{0}_09', inputs.scope)] }}
          BUNDLE_10: ${{ secrets[format('LOAD{0}_10', inputs.scope)] }}
          BUNDLE_11: ${{ secrets[format('LOAD{0}_11', inputs.scope)] }}
          BUNDLE_12: ${{ secrets[format('LOAD{0}_12', inputs.scope)] }}
          BUNDLE_13: ${{ secrets[format('LOAD{0}_13', inputs.scope)] }}
          BUNDLE_14: ${{ secrets[format('LOAD{0}_14', inputs.scope)] }}
          BUNDLE_15: ${{ secrets[format('LOAD{0}_15', inputs.scope)] }}
          BUNDLE_16: ${{ secrets[format('LOAD{0}_16', inputs.scope)] }}
          BUNDLE_17: ${{ secrets[format('LOAD{0}_17', inputs.scope)] }}
          BUNDLE_18: ${{ secrets[format('LOAD{0}_18', inputs.scope)] }}
          BUNDLE_19: ${{ secrets[format('LOAD{0}_19', inputs.scope)] }}
          BUNDLE_20: ${{ secrets[format('LOAD{0}_20', inputs.scope)] }}
          BUNDLE_21: ${{ secrets[format('LOAD{0}_21', inputs.scope)] }}
          BUNDLE_22: ${{ secrets[format('LOAD{0}_22', inputs.scope)] }}
          BUNDLE_23: ${{ secrets[format('LOAD{0}_23', inputs.scope)] }}
          TEST_SCOPE: ${{ inputs.scope }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/run.mjs
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ inputs.scope }}-node-${{ matrix.shard }}
          path: |
            runtime/summary.json
            runtime/execution.json
            runtime/run.log
          retention-days: 1
          if-no-files-found: error
